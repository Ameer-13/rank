<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - منصة النخبة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Tajawal', 'sans-serif'] } } } }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style> 
        body { 
            font-family: 'Tajawal', sans-serif;
            background: radial-gradient(circle at top right, #311042, #0f172a 50%, #090d16);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }
        .glass-input {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            background: rgba(15, 23, 42, 0.7);
            border-color: rgba(168, 85, 247, 0.6);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.25);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen relative overflow-hidden text-white">

    <div class="absolute top-[-10%] right-[-5%] w-96 h-96 bg-purple-600/30 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-[-10%] left-[-5%] w-96 h-96 bg-indigo-600/30 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute top-[40%] left-[20%] w-64 h-64 bg-emerald-500/15 rounded-full blur-[100px] pointer-events-none"></div>

    <div class="w-full max-w-md glass-card rounded-3xl p-8 mx-4 relative z-10">
        
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-gradient-to-tr from-purple-500/80 to-indigo-500/80 backdrop-blur-md border border-white/20 rounded-2xl flex items-center justify-center text-white text-3xl mx-auto mb-4 shadow-lg shadow-purple-500/30">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h2 class="text-2xl font-bold text-white tracking-wide">تسجيل دخول الإدارة</h2>
            <p class="text-sm text-gray-300/80 mt-2">خاص بالمشرفين وإدارة المنصة</p>
        </div>

        <form onsubmit="handleAdminLogin(event)" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-200 mb-2">اسم المستخدم</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute right-4 top-1/2 -translate-y-1/2 text-purple-300/70"></i>
                    <input type="text" id="adminUsername" required placeholder="مثال: ameer" 
                           class="w-full pr-11 pl-4 py-3 rounded-xl glass-input text-white placeholder-gray-400 focus:outline-none font-mono">
                </div>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-200 mb-2">كلمة المرور</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute right-4 top-1/2 -translate-y-1/2 text-purple-300/70"></i>
                    <input type="password" id="adminPassword" required placeholder="••••••••" 
                           class="w-full pr-11 pl-4 py-3 rounded-xl glass-input text-white placeholder-gray-400 focus:outline-none font-mono">
                </div>
            </div>
            
            <p id="adminError" class="text-rose-400 bg-rose-500/10 border border-rose-500/20 py-2 rounded-lg text-xs font-semibold text-center hidden">بيانات الإدارة غير صحيحة!</p>
            
            <button type="submit" id="loginBtn" class="w-full py-3.5 rounded-xl text-sm font-bold bg-gradient-to-r from-purple-600/90 to-indigo-600/90 hover:from-purple-500 hover:to-indigo-500 border border-white/20 text-white shadow-lg shadow-purple-600/30 transition-all backdrop-blur-sm">
                دخول كمسؤول
            </button>
        </form>

        <div class="mt-6 text-center border-t border-white/10 pt-5">
            <p class="text-sm text-gray-300/80 mb-3">هل أنت طالب؟</p>
            <button onclick="loginAsGuestStudent()" class="w-full py-3.5 rounded-xl text-sm font-bold bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-400/30 text-emerald-300 hover:text-white shadow-lg shadow-emerald-900/20 transition-all backdrop-blur-md">
                <i class="fa-solid fa-user-graduate ml-1"></i> أنا طالب (عرض المتصدرين)
            </button>
        </div>

    </div>

    <script>
        const API_URL = "https://api.npoint.io/40c73d1ea3eaa28cb1e8";

        async function handleAdminLogin(e) {
            e.preventDefault();
            const userIn = document.getElementById('adminUsername').value.trim();
            const passIn = document.getElementById('adminPassword').value.trim();
            const errorMsgElement = document.getElementById('adminError');
            const loginBtn = document.getElementById('loginBtn');

            loginBtn.disabled = true;
            loginBtn.textContent = "جاري التحقق...";
            errorMsgElement.classList.add('hidden');

            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                const users = data.users || [];
                
                const matchedUser = users.find(u => u.role === 'admin' && u.username.toLowerCase() === userIn.toLowerCase() && u.password === passIn);

                if (matchedUser) {
                    sessionStorage.setItem('loggedUser', JSON.stringify(matchedUser));
                    window.location.href = 'admin.html';
                } else {
                    errorMsgElement.textContent = "بيانات الإدارة غير صحيحة!";
                    errorMsgElement.classList.remove('hidden');
                }
            } catch (error) {
                errorMsgElement.textContent = "خطأ في الاتصال بالخادم، حاول مجدداً!";
                errorMsgElement.classList.remove('hidden');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = "دخول كمسؤول";
            }
        }

        function loginAsGuestStudent() {
            sessionStorage.setItem('loggedUser', JSON.stringify({ role: 'guest_student', name: 'طالب زائر' }));
            window.location.href = 'student.html';
        }
    </script>
</body>
</html>
